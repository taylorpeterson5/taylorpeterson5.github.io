<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Top Down Shooter</title>
    <!-- Fills its window, so the portfolio page's iframe sets the game's size -->
    <style>
      html, body { height: 100%; margin: 0; overflow: hidden; background: #000; }
      #unity-canvas { display: block; width: 100%; height: 100%; outline: none; background: #231F20; }
      #loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; color: #ccc; font: 14px/1.4 sans-serif; }
      #loading-bar { width: 50%; max-width: 240px; height: 6px; border-radius: 3px; background: #333; overflow: hidden; }
      #loading-fill { width: 0; height: 100%; background: #c48fdc; }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="loading">
      <div id="loading-bar"><div id="loading-fill"></div></div>
      <span id="loading-text">Loading&hellip;</span>
    </div>
    <script>
      // Unity's web audio is AAC, which some browsers can't decode (VS Code's built-in preview, for one). A failed
      // decode stops the game with an error, so a clip that can't be decoded becomes a silent one instead.
      (function () {
        var AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextClass) {
          return;
        }
        var decode = AudioContextClass.prototype.decodeAudioData;
        AudioContextClass.prototype.decodeAudioData = function (data, onSuccess) {
          var context = this;
          return decode.call(context, data).catch(function () {
            return context.createBuffer(1, 1, context.sampleRate);
          }).then(function (buffer) {
            if (onSuccess) {
              onSuccess(buffer);
            }
            return buffer;
          });
        };
      })();
    </script>
    <script src="Build/top-down-shooter.loader.js"></script>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      var loading = document.querySelector("#loading");
      createUnityInstance(canvas, {
        arguments: [],
        dataUrl: "Build/top-down-shooter.data.unityweb",
        frameworkUrl: "Build/top-down-shooter.framework.js.unityweb",
        codeUrl: "Build/top-down-shooter.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "Top Down Shooter",
        productVersion: "0.1",
      }, function (progress) {
        document.querySelector("#loading-fill").style.width = (100 * progress) + "%";
      }).then(function () {
        loading.remove();
        canvas.focus();
      }).catch(function (message) {
        document.querySelector("#loading-text").textContent = message;
      });
    </script>
  </body>
</html>
